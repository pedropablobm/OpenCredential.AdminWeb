# Linux Docker Engine only. The proxy shares the host network to reach the
# loopback-only AdminWeb port; it does not use or change Apache's ports.
services:
  adminweb:
    environment:
      ForwardedHeaders__TrustedProxies__0: ${ADMINWEB_PROXY_GATEWAY:?Set the Docker network gateway observed by AdminWeb}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  proxy:
    image: nginx:stable-alpine
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./deploy/lan-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy-tls:/etc/nginx/opencredential-tls:ro
